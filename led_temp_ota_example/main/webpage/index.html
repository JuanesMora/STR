<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel ESP32-C6</title>

    <link rel="stylesheet" href="app.css">
</head>

<body>

    <main class="dashboard">

        <header class="header">
            <span class="badge">ESP32-C6</span>
            <h1>Panel de Control IoT</h1>
            <p>Configuración de red, control RGB y monitoreo de temperatura.</p>
        </header>

        <section class="grid">

            <!-- CONFIGURACIÓN WIFI -->
            <article class="panel">
                <div class="panel-title">
                    <span class="icon">📶</span>
                    <div>
                        <h2>Red WiFi</h2>
                        <p>Selecciona el modo de conexión del dispositivo.</p>
                    </div>
                </div>

                <div class="form-group">
                    <label for="wifiMode">Modo de operación</label>
                    <select id="wifiMode">
                        <option value="ap">Access Point</option>
                        <option value="sta">Station</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="ssid">Nombre de la red</label>
                    <input type="text" id="ssid" placeholder="Ingrese el SSID">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Ingrese la contraseña">
                </div>

                <button class="btn" onclick="sendWiFi()">
                    Guardar configuración WiFi
                </button>
            </article>

            <!-- CONTROL RGB -->
            <article class="panel">
                <div class="panel-title">
                    <span class="icon">💡</span>
                    <div>
                        <h2>LED RGB</h2>
                        <p>Ajusta la intensidad de cada color entre 0 y 255.</p>
                    </div>
                </div>

                <div class="rgb-row">
                    <div class="form-group">
                        <label for="red">Rojo</label>
                        <input type="number" id="red" min="0" max="255" placeholder="0 - 255">
                    </div>

                    <div class="form-group">
                        <label for="green">Verde</label>
                        <input type="number" id="green" min="0" max="255" placeholder="0 - 255">
                    </div>

                    <div class="form-group">
                        <label for="blue">Azul</label>
                        <input type="number" id="blue" min="0" max="255" placeholder="0 - 255">
                    </div>
                </div>

                <button class="btn secondary" onclick="sendRGB()">
                    Enviar valores RGB
                </button>
            </article>

            <!-- TEMPERATURA -->
            <article class="panel temperature-card">
                <div class="panel-title">
                    <span class="icon">🌡️</span>
                    <div>
                        <h2>Temperatura</h2>
                        <p>Lectura actual reportada por el sistema.</p>
                    </div>
                </div>

                <div class="temperature-box">
                    <label for="temperature">Temperatura actual</label>
                    <input type="text" id="temperature" value="25 °C" readonly>
                </div>
            </article>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
